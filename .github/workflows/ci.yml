name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Gzipped JS bundle size guard (200KB limit)
      - name: Check gzipped JS bundle size
        run: |
          GZIP_SIZE=$(find dist/assets -name '*.js' -exec gzip -c {} + | wc -c)
          MAX_GZIP=204800
          echo "Gzipped JS size: $GZIP_SIZE bytes (limit: $MAX_GZIP)"
          if [ "$GZIP_SIZE" -gt "$MAX_GZIP" ]; then
            echo "::error::Gzipped JS bundle ($GZIP_SIZE bytes) exceeds 200KB limit"
            exit 1
          fi

      # Lockfile consistency
      - name: Verify lockfile
        run: |
          npm ci --ignore-scripts 2>&1 | grep -q "npm warn" && exit 1 || true

      # Security audit
      - name: Security audit
        run: npm audit --audit-level=critical --production
        continue-on-error: true

  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci && npm run build
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: ./lighthouserc.json
