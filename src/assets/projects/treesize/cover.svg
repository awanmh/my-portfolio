<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#131317" />
    </linearGradient>
    <pattern id="grid4" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222228" stroke-width="0.7" />
    </pattern>
    <radialGradient id="glow4" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B3A3A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)" />
  <rect width="800" height="500" fill="url(#grid4)" />
  <circle cx="400" cy="200" r="240" fill="url(#glow4)" />

  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#2A2A30" stroke-width="1" />
  <text x="44" y="52" fill="#5A5A62" font-family="monospace" font-size="11" letter-spacing="3">ANALYTICS // CLOUD_STORAGE_SCANNER</text>
  <text x="756" y="52" fill="#8B3A3A" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="2">[GDRIVE API: SYNCED]</text>

  <!-- Folder Tree Visualization -->
  <g transform="translate(400, 200)">
    <!-- Main directory bar chart / tree -->
    <rect x="-160" y="-60" width="320" height="24" rx="3" fill="#1C1C24" stroke="#3A3A48" stroke-width="1" />
    <rect x="-160" y="-60" width="220" height="24" rx="3" fill="#8B3A3A" opacity="0.8" />
    <text x="-145" y="-44" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold">/root (148.5 GB) [68%]</text>

    <rect x="-140" y="-25" width="280" height="22" rx="3" fill="#181820" stroke="#30303C" stroke-width="1" />
    <rect x="-140" y="-25" width="130" height="22" rx="3" fill="#5A5A65" />
    <text x="-125" y="-10" fill="#E8E8EA" font-family="monospace" font-size="10">├── /shared_drives (64.2 GB)</text>

    <rect x="-120" y="8" width="240" height="20" rx="3" fill="#14141A" stroke="#2A2A34" stroke-width="1" />
    <rect x="-120" y="8" width="70" height="20" rx="3" fill="#3D3D48" />
    <text x="-105" y="22" fill="#8A8A90" font-family="monospace" font-size="9">│   ├── /archives (32.1 GB)</text>

    <rect x="-120" y="36" width="240" height="20" rx="3" fill="#14141A" stroke="#2A2A34" stroke-width="1" />
    <rect x="-120" y="36" width="40" height="20" rx="3" fill="#3D3D48" />
    <text x="-105" y="50" fill="#8A8A90" font-family="monospace" font-size="9">│   └── /orphaned_junk (8.4 GB)</text>
  </g>

  <text x="400" y="380" fill="#E8E8EA" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">GDRIVE TREESIZE</text>
  <text x="400" y="410" fill="#8A8A90" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">RECURSIVE STORAGE ANALYZER &amp; VISUAL DASHBOARD</text>
  <rect x="360" y="430" width="80" height="1" fill="#8B3A3A" />
</svg>
