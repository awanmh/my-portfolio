<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#14141A" />
    </linearGradient>
    <pattern id="grid8" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222228" stroke-width="0.7" />
    </pattern>
    <radialGradient id="glow8" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B3A3A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg8)" />
  <rect width="800" height="500" fill="url(#grid8)" />
  <circle cx="400" cy="200" r="240" fill="url(#glow8)" />

  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#2A2A30" stroke-width="1" />
  <text x="44" y="52" fill="#5A5A62" font-family="monospace" font-size="11" letter-spacing="3">NLP_ENGINE // CONTENT_DISTILLATION_PIPELINE</text>
  <text x="756" y="52" fill="#8B3A3A" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="2">[EXTRACTOR: ACTIVE]</text>

  <!-- Content to Digest Flow -->
  <g transform="translate(400, 195)">
    <!-- Long article -->
    <rect x="-160" y="-55" width="100" height="110" rx="4" fill="#131318" stroke="#33333E" stroke-width="1.5" />
    <line x1="-140" y1="-35" x2="-80" y2="-35" stroke="#8A8A90" stroke-width="2" />
    <line x1="-140" y1="-20" x2="-90" y2="-20" stroke="#5A5A62" stroke-width="2" />
    <line x1="-140" y1="-5" x2="-75" y2="-5" stroke="#5A5A62" stroke-width="2" />
    <line x1="-140" y1="10" x2="-85" y2="10" stroke="#5A5A62" stroke-width="2" />
    <line x1="-140" y1="25" x2="-100" y2="25" stroke="#5A5A62" stroke-width="2" />
    <text x="-110" y="45" fill="#8A8A90" font-family="monospace" font-size="8" text-anchor="middle">5,000 WORDS</text>

    <!-- Arrow / Transformer -->
    <path d="M -40 0 L 20 0" stroke="#8B3A3A" stroke-width="2" stroke-dasharray="4 2" />
    <polygon points="20,-5 30,0 20,5" fill="#8B3A3A" />
    <text x="-10" y="-12" fill="#E8E8EA" font-family="monospace" font-size="9" text-anchor="middle">TRANSFORMER</text>

    <!-- Distilled Summary Card -->
    <rect x="50" y="-45" width="120" height="90" rx="4" fill="#181822" stroke="#8B3A3A" stroke-width="1.5" />
    <text x="65" y="-25" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold">KEY INSIGHTS</text>
    <line x1="65" y1="-15" x2="155" y2="-15" stroke="#30303E" stroke-width="1" />
    <text x="65" y="0" fill="#E8E8EA" font-family="monospace" font-size="9">● Core Thesis</text>
    <text x="65" y="15" fill="#E8E8EA" font-family="monospace" font-size="9">● 3 Action Points</text>
    <text x="65" y="30" fill="#22C55E" font-family="monospace" font-size="8">92% Reading Saved</text>
  </g>

  <text x="400" y="380" fill="#E8E8EA" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">LINKDIGEST.AI</text>
  <text x="400" y="410" fill="#8A8A90" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">INTELLIGENT ARTICLE &amp; WEB SUMMARIZATION PLATFORM</text>
  <rect x="360" y="430" width="80" height="1" fill="#8B3A3A" />
</svg>
