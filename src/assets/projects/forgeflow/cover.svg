<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#16161B" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222228" stroke-width="0.7" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B3A3A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <circle cx="400" cy="220" r="260" fill="url(#glow)" />

  <!-- Technical borders -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#2A2A30" stroke-width="1" />
  <text x="44" y="52" fill="#5A5A62" font-family="monospace" font-size="11" letter-spacing="3">SYS // DISTRIBUTED_ORCHESTRATOR</text>
  <text x="756" y="52" fill="#8B3A3A" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="2">[GO WORKERS: ONLINE]</text>

  <!-- Central Architecture Diagram -->
  <g transform="translate(400, 210)">
    <!-- Nodes -->
    <rect x="-180" y="-45" width="90" height="90" fill="#141418" stroke="#33333C" stroke-width="1.5" rx="4" />
    <text x="-135" y="-10" fill="#8A8A90" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">PRODUCER</text>
    <text x="-135" y="12" fill="#E8E8EA" font-family="monospace" font-size="12" text-anchor="middle">API / CRON</text>

    <!-- Center Queue -->
    <circle cx="0" cy="0" r="58" fill="#1A1A20" stroke="#8B3A3A" stroke-width="2" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#2C2C35" stroke-width="1" stroke-dasharray="4 3" />
    <text x="0" y="-6" fill="#E8E8EA" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1.5">REDIS</text>
    <text x="0" y="14" fill="#8A8A90" font-family="monospace" font-size="10" text-anchor="middle">COORDINATOR</text>

    <!-- Workers -->
    <rect x="100" y="-85" width="100" height="48" fill="#141418" stroke="#33333C" stroke-width="1.5" rx="4" />
    <text x="150" y="-65" fill="#8A8A90" font-family="monospace" font-size="9" text-anchor="middle">WORKER NODE #1</text>
    <text x="150" y="-48" fill="#22C55E" font-family="monospace" font-size="11" text-anchor="middle">● POOL ACTIVE</text>

    <rect x="100" y="35" width="100" height="48" fill="#141418" stroke="#33333C" stroke-width="1.5" rx="4" />
    <text x="150" y="55" fill="#8A8A90" font-family="monospace" font-size="9" text-anchor="middle">WORKER NODE #2</text>
    <text x="150" y="72" fill="#22C55E" font-family="monospace" font-size="11" text-anchor="middle">● POOL ACTIVE</text>

    <!-- Connectors -->
    <path d="M -90 0 L -60 0" stroke="#8A8A90" stroke-width="1.5" stroke-dasharray="3 3" />
    <path d="M 58 -20 L 100 -55" stroke="#8A8A90" stroke-width="1.5" />
    <path d="M 58 20 L 100 55" stroke="#8A8A90" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <text x="400" y="390" fill="#E8E8EA" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">FORGEFLOW</text>
  <text x="400" y="418" fill="#8A8A90" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">DISTRIBUTED WORKFLOW ENGINE IN GOLANG</text>

  <rect x="360" y="438" width="80" height="1" fill="#8B3A3A" />
</svg>
