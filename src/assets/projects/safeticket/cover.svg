<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#15151A" />
    </linearGradient>
    <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222228" stroke-width="0.7" />
    </pattern>
    <radialGradient id="glow2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B3A3A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)" />
  <rect width="800" height="500" fill="url(#grid2)" />
  <circle cx="400" cy="210" r="240" fill="url(#glow2)" />

  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#2A2A30" stroke-width="1" />
  <text x="44" y="52" fill="#5A5A62" font-family="monospace" font-size="11" letter-spacing="3">CONCURRENCY // RACE_CONDITION_GUARD</text>
  <text x="756" y="52" fill="#8B3A3A" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="2">[PESSIMISTIC LOCK: ACTIVE]</text>

  <!-- Ticket graphic & Concurrency lock -->
  <g transform="translate(400, 200)">
    <!-- Ticket outline -->
    <rect x="-140" y="-70" width="280" height="140" rx="8" fill="#141418" stroke="#383844" stroke-width="2" />
    <line x1="-30" y1="-70" x2="-30" y2="70" stroke="#2A2A35" stroke-width="2" stroke-dasharray="6 4" />
    
    <!-- Cutout circles -->
    <circle cx="-30" cy="-70" r="14" fill="#0E0E11" stroke="#383844" stroke-width="2" />
    <circle cx="-30" cy="70" r="14" fill="#0E0E11" stroke="#383844" stroke-width="2" />

    <!-- Details -->
    <text x="-85" y="-20" fill="#E8E8EA" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">SAFE</text>
    <text x="-85" y="5" fill="#8B3A3A" font-family="monospace" font-size="12" text-anchor="middle">TICKET</text>
    <text x="-85" y="30" fill="#5A5A62" font-family="monospace" font-size="9" text-anchor="middle">STK-2025</text>

    <!-- Concurrency Safe Status -->
    <text x="65" y="-30" fill="#8A8A90" font-family="monospace" font-size="10">ISOLATION LEVEL</text>
    <text x="65" y="-12" fill="#E8E8EA" font-family="monospace" font-size="12" font-weight="600">SELECT FOR UPDATE</text>

    <text x="65" y="15" fill="#8A8A90" font-family="monospace" font-size="10">OVERSELL RISK</text>
    <text x="65" y="35" fill="#22C55E" font-family="monospace" font-size="12" font-weight="600">0.00% (VERIFIED)</text>
  </g>

  <text x="400" y="380" fill="#E8E8EA" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">SAFETICKET</text>
  <text x="400" y="410" fill="#8A8A90" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">HIGH-CONCURRENCY TICKET RESERVATION ENGINE</text>
  <rect x="360" y="430" width="80" height="1" fill="#8B3A3A" />
</svg>
