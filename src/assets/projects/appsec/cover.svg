<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <pattern id="grid3" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222228" stroke-width="0.7" />
    </pattern>
    <radialGradient id="glow3" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B3A3A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)" />
  <rect width="800" height="500" fill="url(#grid3)" />
  <circle cx="400" cy="200" r="240" fill="url(#glow3)" />

  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#2A2A30" stroke-width="1" />
  <text x="44" y="52" fill="#5A5A62" font-family="monospace" font-size="11" letter-spacing="3">SEC_OPS // SECURE_SDLC_SIMULATION</text>
  <text x="756" y="52" fill="#8B3A3A" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="2">[STRIDE THREAT AUDIT: PASS]</text>

  <!-- Shield & Architecture Diagram -->
  <g transform="translate(400, 200)">
    <!-- Shield -->
    <path d="M 0 -65 L 55 -35 L 55 25 C 55 60 0 85 0 85 C 0 85 -55 60 -55 25 L -55 -35 Z" fill="#141418" stroke="#8B3A3A" stroke-width="2.5" />
    <!-- Inner Lock -->
    <rect x="-16" y="-6" width="32" height="26" rx="3" fill="#1C1C24" stroke="#E8E8EA" stroke-width="1.5" />
    <path d="M -9 -6 L -9 -16 C -9 -21 9 -21 9 -16 L 9 -6" fill="none" stroke="#E8E8EA" stroke-width="2" />
    <circle cx="0" cy="7" r="3" fill="#8B3A3A" />

    <!-- Badges around -->
    <rect x="-175" y="-30" width="95" height="40" rx="3" fill="#141418" stroke="#2D2D38" stroke-width="1" />
    <text x="-127" y="-14" fill="#8A8A90" font-family="monospace" font-size="9" text-anchor="middle">AUTH MATRIX</text>
    <text x="-127" y="2" fill="#E8E8EA" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">RBAC + JWT</text>

    <rect x="80" y="-30" width="95" height="40" rx="3" fill="#141418" stroke="#2D2D38" stroke-width="1" />
    <text x="127" y="-14" fill="#8A8A90" font-family="monospace" font-size="9" text-anchor="middle">OWASP DEFENSE</text>
    <text x="127" y="2" fill="#22C55E" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">ZERO LEAK</text>
  </g>

  <text x="400" y="380" fill="#E8E8EA" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">FINTECH APPSEC</text>
  <text x="400" y="410" fill="#8A8A90" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">SECURITY SIMULATION &amp; CLEAN ARCHITECTURE CASE STUDY</text>
  <rect x="360" y="430" width="80" height="1" fill="#8B3A3A" />
</svg>
