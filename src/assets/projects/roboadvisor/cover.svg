<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRobo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#15151B" />
    </linearGradient>
    <pattern id="gridRobo" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222228" stroke-width="0.7" />
    </pattern>
    <radialGradient id="glowRobo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B3A3A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgRobo)" />
  <rect width="800" height="500" fill="url(#gridRobo)" />
  <circle cx="400" cy="200" r="240" fill="url(#glowRobo)" />

  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#2A2A30" stroke-width="1" />
  <text x="44" y="52" fill="#5A5A62" font-family="monospace" font-size="11" letter-spacing="3">QUANT // HYBRID_PORTFOLIO_OPTIMIZATION</text>
  <text x="756" y="52" fill="#8B3A3A" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="2">[SHARPE RATIO: 2.14]</text>

  <!-- Efficient Frontier Curve & Scatter -->
  <g transform="translate(400, 195)">
    <!-- Axes -->
    <line x1="-140" y1="55" x2="140" y2="55" stroke="#33333E" stroke-width="1.5" />
    <line x1="-140" y1="55" x2="-140" y2="-65" stroke="#33333E" stroke-width="1.5" />
    <text x="140" y="70" fill="#5A5A62" font-family="monospace" font-size="9" text-anchor="end">RISK (VOLATILITY σ)</text>
    <text x="-140" y="-72" fill="#5A5A62" font-family="monospace" font-size="9">EXPECTED RETURN (R)</text>

    <!-- Curve (Efficient Frontier) -->
    <path d="M -120 40 Q -80 -30, 40 -50 T 130 -58" fill="none" stroke="#8B3A3A" stroke-width="2.5" />
    <!-- Optimal Tangency Point -->
    <circle cx="40" cy="-50" r="5" fill="#E8E8EA" stroke="#8B3A3A" stroke-width="2" />
    <text x="50" y="-55" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold">MAX SHARPE</text>

    <!-- Random Portfolio Scatter Points -->
    <circle cx="-90" cy="35" r="2" fill="#5A5A62" />
    <circle cx="-70" cy="20" r="2" fill="#5A5A62" />
    <circle cx="-50" cy="10" r="2" fill="#5A5A62" />
    <circle cx="-30" cy="-5" r="2" fill="#5A5A62" />
    <circle cx="-10" cy="-20" r="2" fill="#5A5A62" />
    <circle cx="10" cy="-30" r="2" fill="#5A5A62" />
    <circle cx="-60" cy="42" r="2" fill="#444450" />
    <circle cx="-20" cy="25" r="2" fill="#444450" />
    <circle cx="20" cy="10" r="2" fill="#444450" />
    <circle cx="60" cy="-10" r="2" fill="#444450" />
    <circle cx="90" cy="-35" r="2" fill="#444450" />
  </g>

  <text x="400" y="380" fill="#E8E8EA" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">AI ROBO-ADVISOR</text>
  <text x="400" y="410" fill="#8A8A90" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">MODERN PORTFOLIO THEORY &amp; ML ASSET ALLOCATION</text>
  <rect x="360" y="430" width="80" height="1" fill="#8B3A3A" />
</svg>
