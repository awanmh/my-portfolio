<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCollab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <pattern id="gridCollab" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222228" stroke-width="0.7" />
    </pattern>
    <radialGradient id="glowCollab" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B3A3A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0E0E11" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgCollab)" />
  <rect width="800" height="500" fill="url(#gridCollab)" />
  <circle cx="400" cy="200" r="240" fill="url(#glowCollab)" />

  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#2A2A30" stroke-width="1" />
  <text x="44" y="52" fill="#5A5A62" font-family="monospace" font-size="11" letter-spacing="3">ACADEMIC // PROJECT_GOVERNANCE_SYSTEM</text>
  <text x="756" y="52" fill="#8B3A3A" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="2">[JAVA OOP: CLEAN ARCH]</text>

  <!-- Collaboration Diagram -->
  <g transform="translate(400, 195)">
    <rect x="-150" y="-60" width="300" height="120" rx="6" fill="#131317" stroke="#33333E" stroke-width="1.5" />
    
    <!-- Milestone progress -->
    <text x="-120" y="-30" fill="#E8E8EA" font-family="monospace" font-size="11" font-weight="bold">COLLABORA WORKSPACE</text>
    <line x1="-120" y1="-18" x2="120" y2="-18" stroke="#282832" stroke-width="1" />

    <text x="-120" y="5" fill="#8A8A90" font-family="monospace" font-size="9">MILESTONE 1: ARCHITECTURE</text>
    <text x="120" y="5" fill="#22C55E" font-family="monospace" font-size="9" text-anchor="end">100% DONE</text>
    <rect x="-120" y="12" width="240" height="6" rx="2" fill="#22222A" />
    <rect x="-120" y="12" width="240" height="6" rx="2" fill="#22C55E" />

    <text x="-120" y="32" fill="#8A8A90" font-family="monospace" font-size="9">MILESTONE 2: GRADING REVIEW</text>
    <text x="120" y="32" fill="#8B3A3A" font-family="monospace" font-size="9" text-anchor="end">IN PROGRESS</text>
    <rect x="-120" y="38" width="240" height="6" rx="2" fill="#22222A" />
    <rect x="-120" y="38" width="160" height="6" rx="2" fill="#8B3A3A" />
  </g>

  <text x="400" y="380" fill="#E8E8EA" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">COLLABORA</text>
  <text x="400" y="410" fill="#8A8A90" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">ACADEMIC PROJECT &amp; GRADE GOVERNANCE PLATFORM</text>
  <rect x="360" y="430" width="80" height="1" fill="#8B3A3A" />
</svg>
